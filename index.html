<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#f5f4f0;--card:#fff;--tx:#1d1d1b;--tx2:#5f5e5a;--tx3:#8a8880;--bd:#e2e0d9;--ac:#0f766e;--acbg:#e1f5ee;--wa:#854f0b;--wabg:#faeeda;--da:#a32d2d;--dabg:#fcebeb;--ok:#3b6d11;--okbg:#eaf3de;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
header .ttl{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;padding-bottom:86px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
nav button{background:none;border:0;padding:9px 0 7px;font-size:11px;color:var(--tx3);font-family:inherit}
nav button.on{color:var(--ac);font-weight:600}
nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
button,input,select,textarea{font-family:inherit;font-size:16px}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:11px 12px;color:var(--tx)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;width:100%;padding:14px}
.btn.g{background:var(--bg)}
.ib{background:none;border:0;padding:6px;color:var(--tx2);position:relative;line-height:0}
.ib svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
.bdg{position:absolute;top:0;right:0;background:var(--da);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
.fl{padding:12px 14px;border-bottom:1px solid var(--bd)}
.lb{font-size:13px;color:var(--tx2);margin:0 0 7px;line-height:1.45}
.lb b{color:var(--tx);font-weight:600}
.req{color:var(--da)}
.gh{margin:0;padding:16px 14px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);background:var(--bg)}
input[type=text],input[type=number],select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);color:var(--tx)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .b{flex:1 1 auto;min-width:72px}
.b{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:11px 8px;font-size:14px;color:var(--tx)}
.b.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cam{width:100%;border:1.5px dashed var(--bd);border-radius:var(--r);background:var(--bg);padding:18px 10px;color:var(--tx2);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.shot{position:relative;border-radius:var(--r);overflow:hidden;background:#000}
.shot img{display:block;width:100%;max-height:230px;object-fit:cover}
.shot .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:16px;width:30px;height:30px;font-size:16px}
.sum{margin-top:8px;border-radius:var(--r);padding:9px 11px;font-size:13px;line-height:1.5}
.err{color:var(--da);font-size:13px;margin:6px 0 0}
.card{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--bd);align-items:center;background:var(--card)}
.card .th{width:62px;height:62px;border-radius:var(--r);background:var(--bg);flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:11px}
.card h3{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:2px 0;font-size:12px;color:var(--tx2)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.grp{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:14px;font-weight:600}
.dt{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--bd);font-size:14px}
.dt span:first-child{color:var(--tx2);flex-shrink:0}
.dt span:last-child{text-align:right}
.hero img{width:100%;max-height:260px;object-fit:cover;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 14px}
.tiles div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg)}
.tiles img{width:100%;height:100%;object-fit:cover}
.tiles span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 4px;text-align:center}
.fab{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;background:var(--ac);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:4}
@media(max-width:592px){.fab{right:16px}}
.full{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;justify-content:center}
.full img{width:100%;max-height:78vh;object-fit:contain}
.full .bar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.full .bar button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:var(--r);padding:8px 12px;font-size:14px}
.note{font-size:12px;color:var(--tx3);padding:8px 14px;line-height:1.5}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.stat div{background:var(--bg);border-radius:var(--r);padding:10px 12px}
.stat p{margin:0;font-size:12px;color:var(--tx2)}
.stat strong{font-size:24px;font-weight:600}
.banner{margin:0;padding:8px 14px;font-size:12px;font-weight:600}
.star{background:none;border:0;font-size:30px;padding:0 4px;color:#d8d5cc}
.star.on{color:#e6a700}
.search{padding:10px 14px;border-bottom:1px solid var(--bd)}
</style>
</head>

<script>
/* ---------- utilidades ---------- */

/* ---------- base de datos (IndexedDB) ---------- */
var DB=null;
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open('cantonfair',1);
r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains('recs'))d.createObjectStore('recs',{keyPath:'id'});if(!d.objectStoreNames.contains('pics'))d.createObjectStore('pics');};

/* ---------- modelo ---------- */
var CATS=['Lighting 照明','Faucets 水龙头','Hardware 五金','Machinery 机械'];
var STATUS=['To contact 待联系','Sample requested 已索样','Negotiating 洽谈中','Discarded 已放弃'];
var SCOL={'To contact 待联系':['var(--wabg)','var(--wa)'],'Sample requested 已索样':['var(--okbg)','var(--ok)'],'Negotiating 洽谈中':['var(--acbg)','var(--ac)'],'Discarded 已放弃':['var(--dabg)','var(--da)']};
var PICS=[['booth','Booth 展位'],['product','Product 产品'],['card','Card 名片'],['license','License 营业执照'],['catalog','Catalog 目录']];
function prodKeys(r){return Object.keys(r.pics||{}).filter(function(k){return k==='product'||/^product\d+$/.test(k)})
.sort(function(a,b){return (a==='product'?1:+a.slice(7))-(b==='product'?1:+b.slice(7))})}
function picsOf(r){var p=r.pics||{},out=[];if(p.booth)out.push(['booth','Booth 展位']);
prodKeys(r).forEach(function(k,i){out.push([k,'Product 产品'+(i?' '+(i+1):'')])});
if(p.card)out.push(['card','Card 名片']);if(p.license)out.push(['license','License 营业执照']);if(p.catalog)out.push(['catalog','Catalog 目录']);
return out}
var PORTS=['Shenzhen 深圳','Guangzhou 广州','Ningbo 宁波','Shanghai 上海','Xiamen 厦门','Qingdao 青岛'];
var CERTS=['CE','RoHS','ISO9001','UL','None 无'];
var CAP={'20GP':28,'40GP':58,'40HQ':68},WCAP={'20GP':21700,'40GP':26500,'40HQ':26500};
var R=[],S={v:'list',sel:null,ph:null,f:null,err:{},open:{},q:''},URLS={};

function picUrl(key){if(URLS[key])return Promise.resolve(URLS[key]);return dbGet('pics',key).then(function(b){if(!b)return null;URLS[key]=URL.createObjectURL(b);return URLS[key]})}
function catsAll(){var a=CATS.slice();R.forEach(function(r){if(r.cat&&a.indexOf(r.cat)<0)a.push(r.cat)});return a}

/* ---------- cámara y compresión ---------- */
function shrink(file){return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(file);
img.onload=function(){var m=1600,w=img.width,h=img.height,s=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
c.toBlob(function(b){res(b||file)},'image/jpeg',.82)};
img.onerror=function(){URL.revokeObjectURL(u);res(file)};img.src=u})}
function pickPhoto(key,cb){var i=document.createElement('input');i.type='file';i.accept='image/*';
i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;shrink(f).then(function(b){if(URLS[key]){URL.revokeObjectURL(URLS[key]);delete URLS[key]}return dbPut('pics',b,key)}).then(cb)};i.click()}
function pickFile(key,cb){var i=document.createElement('input');i.type='file';
i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;if(URLS[key]){URL.revokeObjectURL(URLS[key]);delete URLS[key]}dbPut('pics',f,key).then(function(){S.f&&(S.f.catalogName=f.name);cb()})};i.click()}

/* ---------- guardar foto en el teléfono ---------- */
function savePhoto(key,name){dbGet('pics',key).then(function(b){if(!b)return;var file=new File([b],name,{type:b.type||'image/jpeg'});
if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(function(){});
else{var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},4000)}})}

/* ---------- escaner QR / QR scanner ---------- */
var QR={stream:null,raf:null};
function qrOpen(){if(document.getElementById('qrbox'))return;
var d=document.createElement('div');d.className='full';d.id='qrbox';
d.innerHTML='<div class="bar"><button onclick="qrClose()">Close 关闭</button><button onclick="qrFromPhoto()">From photo 从照片</button></div><video id="qrv" playsinline muted autoplay style="width:100%;max-height:72vh;object-fit:cover;background:#000"></video><p id="qrmsg" style="color:#ccc;font-size:13px;text-align:center;margin:14px 20px;line-height:1.5">Point the camera at the supplier QR code 请对准供应商二维码</p>';
document.body.appendChild(d);
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('qrmsg').textContent='Camera not available here. Use "From photo" 请用“从照片”';return}
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(st){QR.stream=st;var v=document.getElementById('qrv');if(!v){st.getTracks().forEach(function(t){t.stop()});return}v.srcObject=st;v.setAttribute('playsinline','');var pl=v.play();if(pl&&pl.catch)pl.catch(function(){});qrLoop()}).catch(function(){var m=document.getElementById('qrmsg');if(m)m.textContent='No camera permission. Use "From photo" 没有相机权限，请用“从照片”'})}
function decodeCanvas(c){if(!window.jsQR)return null;var x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height);var code=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});return code&&code.data?code.data:null}
function qrLoop(){var c=document.createElement('canvas');
function tick(){var box=document.getElementById('qrbox'),v=document.getElementById('qrv');if(!box||!v)return;
if(v.videoWidth){var s=Math.min(1,700/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);var t=decodeCanvas(c);if(t){qrFound(t);return}}
QR.raf=requestAnimationFrame(tick)}
tick()}
function qrFromPhoto(){var i=document.createElement('input');i.type='file';i.accept='image/*';
i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;var img=new Image(),u=URL.createObjectURL(f);
img.onload=function(){var c=document.createElement('canvas'),s=Math.min(1,1400/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);var t=decodeCanvas(c);
if(t)qrFound(t);else{var m=document.getElementById('qrmsg');if(m)m.textContent='No QR code found in that photo 未识别到二维码'}};
img.onerror=function(){URL.revokeObjectURL(u)};img.src=u};i.click()}
function qrFound(t){if(navigator.vibrate)navigator.vibrate(60);if(S.f){S.f.catalogUrl=t;qrClose();render()}else qrClose()}
function qrClose(){if(QR.raf)cancelAnimationFrame(QR.raf);QR.raf=null;if(QR.stream){QR.stream.getTracks().forEach(function(t){t.stop()});QR.stream=null}var d=document.getElementById('qrbox');if(d)d.remove()}

/* ---------- guardar todas las fotos / save all photos ---------- */
var DET={id:null,files:[]};
function preloadFiles(r){DET={id:r.id,files:[]};
picsOf(r).forEach(function(p){if(p[0]==='catalog')return;
dbGet('pics',r.id+'_'+p[0]).then(function(b){if(b&&DET.id===r.id)DET.files.push(new File([b],'canton_'+r.n+'_'+p[0]+'.jpg',{type:b.type||'image/jpeg'}))})})}
function saveAllPhotos(){var r=recSel();if(!r)return;var fs=DET.id===r.id?DET.files.slice():[];
if(!fs.length){alert('No photos yet 暂无照片');return}
if(navigator.canShare&&navigator.canShare({files:fs})){navigator.share({files:fs,title:'#'+r.n+' '+(r.co||r.prod||'')}).catch(function(){});return}
fs.forEach(function(f,i){setTimeout(function(){var u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000)},i*500)})}

/* ---------- CSV + ZIP ---------- */
var HEAD=['No','Date','Company 公司名称','Contact 联系人','Phone 电话','WhatsApp','Email','Booth 展位号','Self-run export license 自营出口权','CI+PL wet seal 发票箱单盖原章','WeChat video 视频验厂','WeChat ID 微信号','Product 产品','Category 类别','Certifications 国际认证','110V 60Hz','Samples 样品','Sample cost USD','Sample taken','Carton length cm','Carton width cm','Carton height cm','Gross weight per carton kg','MOQ FCA','FCA price USD','FCA place','Cartons FCA','FCA total USD','FCA CBM','FCA weight kg','Container','FOB quantity','FOB price USD','FOB port','Cartons FOB','FOB total USD','FOB CBM','FOB weight kg','Warranty 质保','Rating','Status','Notes','Photos','Catalog link 目录链接'];
function rowOf(r){var cbm=num(r.l)*num(r.w)*num(r.h)/1e6;
return [r.n,new Date(r.ts).toLocaleString(),r.co,r.contact,r.phone,r.whats,r.email,r.booth,r.exp?'Yes':'No',r.seal?'Yes':'No',r.video?'Yes':'No',r.wechat,r.prod,r.cat,(r.certs||[]).join(' / '),r.volt?'Yes':'No',r.sample,r.sampleCost,r.sampleTaken?'Yes':'No',r.l,r.w,r.h,r.gw,r.moq,r.fca,r.fcaPlace,r.cartonsF,num(r.moq)*num(r.fca),(cbm*num(r.cartonsF)).toFixed(3),num(r.gw)*num(r.cartonsF),r.cont,r.qty,r.fob,r.port,r.cartonsB,num(r.qty)*num(r.fob),(cbm*num(r.cartonsB)).toFixed(3),num(r.gw)*num(r.cartonsB),r.warranty,r.rating,r.status,(r.notes||'').replace(/\n/g,' '),picsOf(r).map(function(p){return r.n+'_'+p[0]+'.jpg'}).join(' '),r.catalogUrl||'']}
function csvText(){var rows=[HEAD].concat(R.slice().sort(function(a,b){return a.n-b.n}).map(rowOf));
return '﻿'+rows.map(function(r){return r.map(function(c){c=c==null?'':String(c);return /[";,\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n')}
function dl(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},6000)}
var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){var parts=[],cd=[],off=0,enc=new TextEncoder();
function n2(v){return [v&255,(v>>8)&255]}function n4(v){return [v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255]}
files.forEach(function(f){var nm=enc.encode(f.name),c=crc32(f.data),sz=f.data.length;

function chip(k,v,lab){var on=f()[k]===v;return '<button class="b'+(on?' on':'')+'" onclick="setF(\''+k+'\','+(typeof v==='number'?v:"'"+v+"'")+')">'+lab+'</button>'}
function er(k){return S.err[k]?'<p class="err">'+S.err[k]+'</p>':''}
function camBox(k,label){var has=f().pics&&f().pics[k];
return '<div id="cam_'+k+'">'+(has?'<div class="shot" id="shot_'+k+'"><button class="x" onclick="event.stopPropagation();rmPic(\''+k+'\')">✕</button></div>':'<button class="cam" onclick="addPic(\''+k+'\')">'+svg('cam','width:20px;height:20px')+' '+label+'</button>')+'</div>'}
function addPic(k){var id=f().id;pickPhoto(id+'_'+k,function(){f().pics[k]=1;delete S.err[k];render()})}
function rmPic(k){var id=f().id;if(URLS[id+'_'+k]){URL.revokeObjectURL(URLS[id+'_'+k]);delete URLS[id+'_'+k]}dbDel('pics',id+'_'+k).then(function(){delete f().pics[k];render()})}
function fillFormPics(){var id=f().id;Object.keys(f().pics||{}).forEach(function(k){if(k==='catalog')return;var box=document.getElementById('shot_'+k);if(box)picUrl(id+'_'+k).then(function(u){if(u&&box&&!box.querySelector('img'))box.insertAdjacentHTML('afterbegin','<img src="'+u+'">')})})}
function toggleCert(c){var a=f().certs||[];if(c.indexOf('None')===0)f().certs=a.indexOf(c)>=0?[]:[c];else{a=a.filter(function(x){return x.indexOf('None')!==0});f().certs=a.indexOf(c)>=0?a.filter(function(x){return x!==c}):a.concat([c])}render()}
function vForm(){var r=f();
return head(r.isNew?'New supplier #'+r.n:'Edit #'+r.n,'<button class="ib" onclick="cancelForm()">'+svg('x')+'</button>','<span class="pill" style="background:var(--wabg);color:var(--wa)">'+(navigator.onLine?'Online':'Offline')+'</span>')+'<main>'+
'<p class="gh">Supplier 供应商</p>'+
'<div class="fl"><p class="lb"><b>Booth photo</b> 展位照片 <span class="req">*</span></p>'+camBox('booth','Take photo / choose from gallery')+er('booth')+'</div>'+
'<div class="fl"><div class="g2"><div><p class="lb"><b>Booth no.</b> 展位号</p>'+fld('booth','11.2 C15')+'</div><div><p class="lb"><b>Company</b> 公司名称</p>'+fld('co','Zhongshan Bright')+'</div><div><p class="lb"><b>Contact</b> 联系人</p>'+fld('contact','Kevin Liu')+'</div><div><p class="lb"><b>Phone</b> 电话</p>'+fld('phone','+86 138…')+'</div><div><p class="lb"><b>WhatsApp</b></p>'+fld('whats','+86 138…')+'</div><div><p class="lb"><b>Email</b></p>'+fld('email','sales@…')+'</div></div></div>'+
'<div class="fl"><p class="lb"><b>Self-run export license?</b> 是否有自营出口权？ <span class="req">*</span></p><div class="row">'+chip('exp',1,'Yes 是')+chip('exp',0,'No 否')+'</div>'+er('exp')+'</div>'+
'<div class="fl"><p class="lb"><b>Can you issue the Commercial Invoice and Packing List with the original company wet seal?</b> 能否提供加盖公司公章原件的商业发票和装箱单？ <span class="req">*</span></p><div class="row">'+chip('seal',1,'Yes 是')+chip('seal',0,'No 否')+'</div>'+er('seal')+'</div>'+
'<div class="fl"><p class="lb"><b>Live WeChat video call?</b> (production line, machinery running, raw material warehouse, company sign at the entrance) 能否微信视频实时展示生产线、设备、原材料仓库及公司招牌？</p><div class="row">'+chip('video',1,'Yes 是')+chip('video',0,'No 否')+'</div>'+(r.video===1?'<p class="lb" style="margin-top:10px"><b>WeChat ID</b> 微信号</p>'+fld('wechat','kevin_liu88'):'')+'</div>'+
'<p class="gh">Product 产品</p>'+
'<div class="fl"><p class="lb"><b>Product</b> 产品 <span class="req">*</span></p>'+fld('prod','LED panel 60x60 40W')+er('prod')+'</div>'+
'<div class="fl"><p class="lb"><b>Category</b> 类别 <span class="req">*</span></p><select onchange="setF(\'cat\',this.value)"><option value="">Select 选择…</option>'+catsAll().map(function(c){return '<option'+(r.cat===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'<option value="__o"'+(r.cat==='__o'?' selected':'')+'>Other 其他…</option></select>'+(r.cat==='__o'?'<div style="margin-top:8px">'+fld('catOther','Solar 太阳能')+'</div>':'')+er('cat')+'</div>'+
'<div class="fl"><p class="lb"><b>Product photos</b> 产品照片 ('+prodKeys(r).length+')</p>'+prodKeys(r).map(function(k){return camBox(k,'')}).join('')+'<button class="cam" style="margin-top:8px" onclick="addProd()">'+svg('cam','width:18px;height:18px')+' Add photo 添加照片</button></div>'+
'<div class="fl"><p class="lb"><b>Certifications</b> 国际认证</p><div class="row">'+CERTS.map(function(c){return '<button class="b'+((r.certs||[]).indexOf(c)>=0?' on':'')+'" onclick="toggleCert(\''+c+'\')">'+c+'</button>'}).join('')+'</div></div>'+
'<div class="fl"><p class="lb"><b>110–120V / 60Hz version, plug A/B (Venezuela)?</b> 是否有110–120V/60Hz版本？</p><div class="row">'+chip('volt',1,'Yes 是')+chip('volt',0,'No 否')+'</div></div>'+
'<div class="fl"><p class="lb"><b>Samples</b> 样品</p><div class="row">'+chip('sample','Free 免费','Free 免费')+chip('sample','Paid 收费','Paid 收费')+chip('sample','Not available 不提供','N/A 不提供')+'</div>'+(r.sample==='Paid 收费'?'<p class="lb" style="margin-top:10px"><b>Sample cost</b> 样品费 USD</p>'+fld('sampleCost','35','number'):'')+(r.sample&&r.sample!=='Not available 不提供'?'<p class="lb" style="margin-top:10px"><b>Sample taken?</b> 已取样品？</p><div class="row">'+chip('sampleTaken',1,'Yes 是')+chip('sampleTaken',0,'No 否')+'</div>':'')+'</div>'+
'<div class="fl"><p class="lb"><b>Carton</b> 外箱 cm — length · width · height · <b>gross weight</b> 毛重 kg</p><div class="g4">'+fld('l','62','number')+fld('w','62','number')+fld('h','45','number')+fld('gw','14.5','number')+'</div></div>'+
'<p class="gh" style="color:var(--ac)">FCA · MOQ 货交承运人</p>'+
'<div class="fl"><div class="g2"><div><p class="lb">MOQ 起订量</p>'+fld('moq','500','number')+'</div><div><p class="lb">Unit price USD 单价</p>'+fld('fca','4.20','number')+'</div><div><p class="lb">Place 交货地点</p><select onchange="S.f.fcaPlace=this.value"><option'+(r.fcaPlace==='Factory 工厂'?' selected':'')+'>Factory 工厂</option><option'+(r.fcaPlace==='Warehouse 仓库'?' selected':'')+'>Warehouse 仓库</option></select></div><div><p class="lb">Cartons 箱数</p>'+fld('cartonsF','25','number')+'</div></div><div class="sum" style="background:var(--acbg);color:var(--ac)" id="sumF">—</div></div>'+
'<p class="gh" style="color:var(--ok)">FOB · Container 离岸价</p>'+
'<div class="fl"><div class="g2"><div><p class="lb">Container 柜型</p><select onchange="S.f.cont=this.value;calc()">'+['40HQ','40GP','20GP'].map(function(c){return '<option'+(r.cont===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div><div><p class="lb">Quantity 整柜数量</p>'+fld('qty','7600','number')+'</div><div><p class="lb">Unit price USD 单价</p>'+fld('fob','4.05','number')+'</div><div><p class="lb">Port 离岸港口</p><select onchange="S.f.port=this.value">'+PORTS.map(function(p){return '<option'+(r.port===p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select></div></div><p class="lb" style="margin-top:10px">Cartons in container 整柜箱数</p>'+fld('cartonsB','380','number')+'<div class="sum" style="background:var(--okbg);color:var(--ok)" id="sumB">—</div></div>'+
'<div class="fl"><p class="lb"><b>Warranty</b> 质保</p>'+fld('warranty','2 years 2年')+'</div>'+
'<p class="gh">Documents 文件</p>'+
'<div class="fl"><p class="lb"><b>Catalog</b> 产品目录（上传文件）</p>'+(r.pics&&r.pics.catalog?'<div class="row"><span style="flex:1;font-size:14px;color:var(--ok);align-self:center">'+esc(r.catalogName||'file attached')+'</span><button class="b" onclick="rmPic(\'catalog\')">Remove</button></div>':'<button class="cam" onclick="addCatalog()">Attach file 上传文件</button>')+'</div>'+'<div class="fl"><p class="lb"><b>Catalog link</b> 目录链接 · QR</p><div style="display:flex;gap:8px">'+fld('catalogUrl','https://…')+'<button class="b" style="flex:0 0 auto;white-space:nowrap" onclick="qrOpen()">Scan QR 扫码</button></div>'+(r.catalogUrl?'<p class="note" style="padding:6px 0 0;word-break:break-all">'+esc(r.catalogUrl)+'</p>':'')+'</div>'+
'<div class="fl"><p class="lb"><b>Business license</b> 请提供营业执照复印件</p>'+camBox('license','Photo of the license')+'</div>'+
'<div class="fl"><p class="lb"><b>Business card</b> 名片照片</p>'+camBox('card','Photo of the card')+(r.pics&&r.pics.card?(CARD.busy?'<button class="btn g" style="width:100%;margin-top:8px" disabled>Reading… 识别中</button>':'<button class="btn g" style="width:100%;margin-top:8px" onclick="readCard()">Read card 读取名片</button>'):'')+(CARD.msg?'<p class="note" style="padding:8px 0 0">'+esc(CARD.msg)+'</p>':'')+'</div>'+
'<p class="gh">My evaluation 我的评价</p>'+
'<div class="fl"><p class="lb"><b>Rating</b></p><div>'+[1,2,3,4,5].map(function(i){return '<button class="star'+((r.rating||0)>=i?' on':'')+'" onclick="setF(\'rating\','+i+')">★</button>'}).join('')+'</div></div>'+
'<div class="fl"><p class="lb"><b>Notes</b> 备注</p><textarea oninput="S.f.notes=this.value" placeholder="Good finish, owner replies fast…">'+esc(r.notes||'')+'</textarea></div>'+
'<div class="fl"><p class="lb"><b>Follow-up</b> 跟进状态</p><div class="g2">'+STATUS.map(function(s){return chip('status',s,s)}).join('')+'</div></div>'+
'<div class="fl" style="border:0">'+(Object.keys(S.err).length?'<p class="err" style="margin:0 0 10px">Please complete the fields marked in red</p>':'')+'<button class="btn p" onclick="save()">Save supplier</button></div>'+
'</main>'}
function addProd(){var r=f(),ks=prodKeys(r),n=1;while(ks.indexOf(n===1?'product':'product'+n)>=0)n++;
addPic(n===1?'product':'product'+n)}
var CARD={busy:0,msg:''};
// lee la tarjeta con el OCR de Drive (via Apps Script): necesita internet
function readCard(){var r=f();if(!DRIVE.url){CARD.msg='Paste the Drive link in Export first 请先在 Export 粘贴链接';render();return}
CARD.busy=1;CARD.msg='';render();
dbGet('pics',r.id+'_card').then(function(blob){if(!blob)throw new Error('no card');
return b64(blob).then(function(d){return fetch(DRIVE.url,{method:'POST',body:JSON.stringify({action:'card',type:blob.type||'image/jpeg',data:d})}).then(function(res){return res.json()})})})
.then(function(out){CARD.busy=0;
if(!out||!out.ok||!out.fields){CARD.msg='Could not read the card 未能识别';render();return}
var co=((out.fields||{}).company||'').trim();
if(!co){CARD.msg='Company name not found 未找到公司名称';render();return}
f().co=co;CARD.msg='Company 公司名称: '+co+' — check before saving 请核对';render()})
.catch(function(){CARD.busy=0;CARD.msg='Read failed — check internet 识别失败';render()})}
function addCatalog(){pickFile(f().id+'_catalog',function(){f().pics.catalog=1;render()})}
function calc(){var r=f();if(!r)return;var c=num(r.l)*num(r.w)*num(r.h)/1e6,a=document.getElementById('sumF'),b=document.getElementById('sumB');if(!a)return;
a.textContent='Total '+money(num(r.moq)*num(r.fca))+' · '+(c*num(r.cartonsF)).toFixed(2)+' m³ · '+Math.round(num(r.gw)*num(r.cartonsF))+' kg';
var v=c*num(r.cartonsB),w=num(r.gw)*num(r.cartonsB),cap=CAP[r.cont||'40HQ'],wc=WCAP[r.cont||'40HQ'];
b.textContent='Total '+money(num(r.qty)*num(r.fob))+' · '+v.toFixed(1)+' m³ · '+Math.round(w).toLocaleString()+' kg'+(r.cartonsB?' · fill '+Math.round(v/cap*100)+'%':'')+(w>wc?' · over the weight limit':'')}

/* ---------- acciones ---------- */
function recSel(){for(var i=0;i<R.length;i++)if(R[i].id===S.sel)return R[i]}
function openRec(id){S.sel=id;S.v='detail';render()}
function newForm(){CARD={busy:0,msg:''};S.f={id:uid(),n:(R.reduce(function(m,r){return Math.max(m,r.n)},0)+1),isNew:1,pics:{},certs:[],cat:'',sample:'',rating:0,status:STATUS[0],fcaPlace:'Factory 工厂',cont:'40HQ',port:PORTS[0]};S.err={};S.back=S.v;S.v='form';render();window.scrollTo(0,0)}
function editRec(id){CARD={busy:0,msg:''};var r=R.filter(function(x){return x.id===id})[0];S.f=JSON.parse(JSON.stringify(r));S.f.isNew=0;S.err={};S.back='detail';S.v='form';render();window.scrollTo(0,0)}
function cancelForm(){var r=f();if(r.isNew)Object.keys(r.pics||{}).forEach(function(k){dbDel('pics',r.id+'_'+k)});S.f=null;S.v=S.back==='detail'?'detail':(S.back||'list');render()}
function save(){var r=f();S.err={};
if(!(r.pics&&r.pics.booth))S.err.booth='Take the booth photo first';
if(r.exp===undefined)S.err.exp='Choose Yes or No';
if(r.seal===undefined)S.err.seal='Choose Yes or No';
if(!(r.prod||'').trim())S.err.prod='Enter the product';
var cat=r.cat==='__o'?(r.catOther||'').trim():r.cat;if(!cat)S.err.cat='Choose or type a category';
if(Object.keys(S.err).length){render();window.scrollTo(0,0);return}
r.cat=cat;delete r.catOther;r.ts=r.ts||Date.now();r.upd=Date.now();var isNew=r.isNew;delete r.isNew;
dbPut('recs',JSON.parse(JSON.stringify(r))).then(function(){
var i=R.map(function(x){return x.id}).indexOf(r.id);if(i>=0)R[i]=r;else R.push(r);
if(CATS.indexOf(cat)<0&&catsAll().indexOf(cat)<0)CATS.push(cat);
S.f=null;S.sel=r.id;S.v=isNew?'list':'detail';render()})}
function delRec(id){if(!confirm('Delete this supplier and its photos? This cannot be undone.'))return;
var rec=R.filter(function(x){return x.id===id})[0]||{};Object.keys(rec.pics||{}).forEach(function(k){dbDel('pics',id+'_'+k);if(URLS[id+'_'+k]){URL.revokeObjectURL(URLS[id+'_'+k]);delete URLS[id+'_'+k]}});
dbDel('recs',id).then(function(){R=R.filter(function(r){return r.id!==id});S.v='list';render()})}
function wipe(){if(!confirm('This deletes ALL suppliers and photos on this phone. Are you sure? Export the ZIP first.'))return;
if(!confirm('Last confirmation: everything will be deleted.'))return;
Promise.all([new Promise(function(r){var q=tx('recs','readwrite').clear();q.onsuccess=r}),new Promise(function(r){var q=tx('pics','readwrite').clear();q.onsuccess=r})]).then(function(){R=[];URLS={};S.v='list';render()})}
function go(v){if(S.f&&v!=='form'){if(!confirm('A supplier form is half filled. Leave without saving?'))return;cancelForm()}
S.back=v;S.v=v;S.sel=v==='detail'?S.sel:S.sel;render();window.scrollTo(0,0)}

/* ---------- render ---------- */
function render(){var m={list:vList,cat:vCat,status:vStatus,export:vExport,detail:vDetail,photo:vPhoto,form:vForm};
document.getElementById('app').innerHTML=m[S.v]();
if(S.v==='list'||S.v==='cat'||S.v==='status')fillThumbs();
if(S.v==='detail')fillDetailPics();
if(S.v==='photo')fillBig();
if(S.v==='form'){fillFormPics();calc()}}
window.addEventListener('beforeunload',function(e){if(S.f){e.preventDefault();e.returnValue=''}});
openDB().then(function(){return dbAll('recs')}).then(function(rows){R=rows||[];render()}).catch(function(e){document.getElementById('app').innerHTML='<main><p class="note" style="padding:40px 20px">Could not open the local database: '+esc(e&&e.message)+'</p></main>'});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){reg.update();setInterval(function(){reg.update()},3600000);reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='activated'&&!S.f)location.reload()})})}).catch(function(){})}
</script>
</body>
</html>
